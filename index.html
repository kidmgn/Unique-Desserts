<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Уникальные десерты — Каталог</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' x='-10' font-size='90'>🍰</text></svg>">
  
  <script>
    (function() {
      var theme = localStorage.getItem('sweetbake_theme');
      var colors = { pink: '#fff0f5', brown: '#f5e6d3', green: '#ecfdf5', yellow: '#fefce8', dark: '#0f172a' };
      if (theme && colors[theme]) {
        document.documentElement.style.backgroundColor = colors[theme];
      }
    })();
  </script>
  
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&family=Great+Vibes&display=swap" rel="stylesheet">
  <style>
    .pill { display: flex; align-items: center; gap: 8px; }
    
    #sortSelect {
      border: none;
      background: transparent;
      outline: none;
      color: var(--text);
      font-family: inherit;
      font-size: 1rem;
      cursor: pointer;
    }
  </style>
</head>
<body id="app-body">
  <header>
    <div class="container nav">
      <a href="index.html" class="brand">
        <div class="logo"></div>
        <div>🍰 Уникальные десерты</div>
      </a>
      <div class="nav-actions">
        <div id="themeSwitcher"></div>
        
        <a href="login.html" class="pill" id="guestBtn" style="text-decoration: none;">
          <span>👤</span>
          <span>Вход / Регистрация</span>
        </a>
        
        <span class="pill" id="userGreeting" style="display: none;">
          <span id="userAvatar">👤</span>
          <span id="userName">Гость</span>
        </span>
        <a href="settings.html" class="btn" id="settingsLink" style="display: none;">⚙️ Настройки</a>
        
        <span class="btn-wrapper" id="adminBtnWrapper" style="display: none;">
          <a href="admin.html" class="btn primary">🛠️ Админ</a>
          <span class="notification-dot" id="adminNotificationDot"></span>
        </span>
        
        <button class="btn" id="logoutBtn" style="display: none;">🚪 Выйти</button>
      </div>
    </div>
  </header>

  <main class="container">
    <div class="hero">
      <h1>Десерты, созданные с душой</h1>
      <p>Только натуральные ингредиенты · Доставка по городу</p>
    </div>

    <div class="toolbar">
      <div class="pill">
        <span>🔍</span>
        <input type="text" id="searchInput" placeholder="Шоколад, клубника, карамель...">
      </div>
      
      <div class="pill">
        <span>📋</span>
        <select id="sortSelect" style="padding: 10px 16px; border-radius: 20px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-family: inherit; font-size: 1rem; cursor: pointer;">
  <option value="default">По умолчанию</option>
  <option value="price-asc">Цена: по возрастанию</option>
  <option value="price-desc">Цена: по убыванию</option>
  <option value="name-asc">Название: А-Я</option>
  <option value="name-desc">Название: Я-А</option>
</select>
      </div>
    </div>

    <div class="cards-grid" id="cardsContainer">
      <div class="notice">🍬 Загружаем вкусности...</div>
    </div>
  </main>

  <footer>
    <div class="container footer-wrap">
      <div>
        <div class="footer-title">📞 Контакты</div>
        <div class="footer-sub">Свяжитесь с нами для заказа</div>
        <div class="contact-list" id="footerContacts"></div>
      </div>
      <div class="small">
        <div><b>🍪 Навигация:</b></div>
        <div><a href="index.html">Каталог</a> · <a href="cake.html?id=cake_1">Пример торта</a> · <a href="orders.html">Заказы</a></div>
        <div style="margin-top: 16px;">© 2026 Уникальные десерты</div>
      </div>
    </div>
  </footer>

  <script src="js/theme.js"></script>
  <script src="js/api.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/fonts.js"></script>
  
  <script>
    (function(){
      "use strict";

      let currentUser = null;

      async function init() {
        SweetBakeTheme.createSwitcher('themeSwitcher');
        await updateAuthUI();
        await loadContacts();
        await loadCakes();
        
        const searchInput = document.getElementById('searchInput');
        const debouncedLoad = SweetBakeUtils.debounce(loadCakes, 300);
        searchInput.addEventListener('input', () => {
          debouncedLoad(searchInput.value);
        });
        
        document.getElementById('sortSelect').addEventListener('change', () => {
          loadCakes(searchInput.value);
        });
        
        document.getElementById('logoutBtn')?.addEventListener('click', () => {
          SweetBakeAPI.auth.logout();
          window.location.reload();
        });
      }

      async function updateAuthUI() {
        try { currentUser = await SweetBakeAPI.auth.getCurrentUser(); } catch (e) { currentUser = null; }
        
        const guestBtn = document.getElementById('guestBtn');
        const userGreeting = document.getElementById('userGreeting');
        const adminBtnWrapper = document.getElementById('adminBtnWrapper');
        const settingsLink = document.getElementById('settingsLink');
        const logoutBtn = document.getElementById('logoutBtn');
        
        if (!currentUser) {
          if (guestBtn) guestBtn.style.display = 'flex';
          if (userGreeting) userGreeting.style.display = 'none';
          if (adminBtnWrapper) adminBtnWrapper.style.display = 'none';
          if (settingsLink) settingsLink.style.display = 'none';
          if (logoutBtn) logoutBtn.style.display = 'none';
        } else {
          if (guestBtn) guestBtn.style.display = 'none';
          if (userGreeting) {
            userGreeting.style.display = 'flex';
            const savedAvatar = localStorage.getItem(`avatar_${currentUser.id}`) || '👤';
            document.getElementById('userAvatar').textContent = savedAvatar;
            document.getElementById('userName').textContent = currentUser.name || currentUser.email;
          }
          if (settingsLink) settingsLink.style.display = 'inline-flex';
          if (adminBtnWrapper) {
            adminBtnWrapper.style.display = currentUser.role === 'admin' ? 'inline-flex' : 'none';
            if (currentUser.role === 'admin') SweetBakeUtils.checkNewOrders();
          }
          if (logoutBtn) logoutBtn.style.display = 'inline-flex';
        }
        return currentUser;
      }

      async function loadContacts() {
        try {
          const contacts = await SweetBakeAPI.api.contacts.get();
          const container = document.getElementById('footerContacts');
          if (!container) return;
          container.innerHTML = '';
          (contacts.items || []).forEach(item => {
            const row = document.createElement('div');
            row.className = 'contact-row';
            row.innerHTML = `<span class="contact-label">${item.label}</span><span>${item.value}</span>`;
            container.appendChild(row);
          });
        } catch (e) { console.warn('Контакты не загружены'); }
      }

      async function loadCakes(searchTerm = '') {
        const container = document.getElementById('cardsContainer');
        const sortBy = document.getElementById('sortSelect').value;
        
        try {
          const cakes = await SweetBakeAPI.api.cakes.getAll();
          const term = searchTerm.toLowerCase();
          
          let filtered = cakes.filter(c => 
            !term || 
            c.title.toLowerCase().includes(term) || 
            (c.ingredients || []).join(' ').toLowerCase().includes(term)
          );
          
          // Сортировка
          switch (sortBy) {
            case 'price-asc':
              filtered.sort((a, b) => a.price - b.price);
              break;
            case 'price-desc':
              filtered.sort((a, b) => b.price - a.price);
              break;
            case 'name-asc':
              filtered.sort((a, b) => a.title.localeCompare(b.title, 'ru'));
              break;
            case 'name-desc':
              filtered.sort((a, b) => b.title.localeCompare(a.title, 'ru'));
              break;
          }
          
          if (filtered.length === 0) {
            container.innerHTML = '<div class="notice">😕 Ничего не найдено</div>';
            return;
          }
          
          container.innerHTML = filtered.map(cake => `
            <article class="cake-card" onclick="location.href='cake.html?id=${cake.id}'">
              <div class="card-media">
                ${cake.media?.[0]?.type === 'video' 
                  ? `<video src="${cake.media[0].url}" muted autoplay loop playsinline></video>`
                  : `<img src="${cake.media?.[0]?.url || 'https://placehold.co/600x400/fbcfe8/4a154b?text=🍰'}" alt="${cake.title}">`
                }
              </div>
              <div class="card-content">
                <div class="card-title">
                  <h3>${cake.title}</h3>
                  <span class="price">${SweetBakeUtils.formatPrice(cake.price)}</span>
                </div>
                <div class="card-desc">${cake.short} · ${(cake.ingredients || []).slice(0,4).join(', ')}</div>
                <div class="tags">
                  ${(cake.ingredients || []).slice(0,3).map(t => `<span class="tag">${t}</span>`).join('')}
                </div>
              </div>
            </article>
          `).join('');
          
        } catch (e) {
          container.innerHTML = '<div class="notice">⚠️ Сервер не запущен. Выполните: npm start</div>';
        }
      }

      init();
    })();
  </script>
</body>
</html>
