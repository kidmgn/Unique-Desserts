<!DOCTYPE html>
<html lang="ru">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&family=Pacifico&display=swap" rel="stylesheet">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Регистрация | Уникальные десерты</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' x='-10' font-size='90'>📝</text></svg>">
  
  <script>
    (function() {
      var theme = localStorage.getItem('sweetbake_theme');
      var colors = { pink: '#fff0f5', brown: '#f5e6d3', green: '#ecfdf5', yellow: '#fefce8', dark: '#0f172a' };
      if (theme && colors[theme]) {
        document.documentElement.style.backgroundColor = colors[theme];
      }
    })();
  </script>
  
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    .auth-container { max-width: 450px; margin: 40px auto; }
    
    .auth-panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 30px;
      padding: 40px 35px;
      backdrop-filter: blur(8px);
      box-shadow: var(--shadow);
    }
    
    .auth-title { font-size: 2rem; font-weight: 700; margin-bottom: 8px; text-align: center; }
    .auth-subtitle { text-align: center; color: var(--muted); margin-bottom: 28px; }
    
    .auth-form { display: flex; flex-direction: column; gap: 22px; }
    
    .form-group { display: flex; flex-direction: column; gap: 8px; }
    
    .form-group label { color: var(--text); font-weight: 600; font-size: 0.95rem; margin-left: 5px; }
    
    .form-group input {
      width: 100%;
      padding: 15px 18px;
      border-radius: 18px;
      border: 1.5px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-family: inherit;
      font-size: 1rem;
      transition: border-color 0.2s, box-shadow 0.2s;
      outline: none;
    }
    
    .form-group input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(249, 168, 212, 0.15); }
    
    .form-group input::placeholder { color: var(--muted); opacity: 0.6; font-size: 0.9rem; }
    
    .password-hint { font-size: 0.8rem; color: var(--muted); margin-top: 5px; margin-left: 5px; }
    
    .email-hint { font-size: 0.8rem; color: var(--muted); margin-top: 5px; margin-left: 5px; }
    
    .btn-register {
      width: 100%;
      padding: 16px;
      font-size: 1.1rem;
      justify-content: center;
      margin-top: 10px;
      background: linear-gradient(135deg, var(--accent2), var(--accent));
      border: none;
      color: white;
      font-weight: 700;
      border-radius: 18px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    
    .btn-register:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
    .btn-register:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    
    .auth-footer { text-align: center; margin-top: 25px; padding-top: 20px; border-top: 1px solid var(--border); }
    
    .auth-footer a { color: var(--accent); font-weight: 700; text-decoration: none; transition: opacity 0.2s; }
    .auth-footer a:hover { opacity: 0.8; text-decoration: underline; }
    
    .error-message {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #ef4444;
      padding: 14px 18px;
      border-radius: 18px;
      font-size: 0.9rem;
      display: none;
      margin-bottom: 20px;
    }
    
    .error-message.show { display: block; }
    
    .success-message {
      background: rgba(34, 197, 94, 0.1);
      border: 1px solid rgba(34, 197, 94, 0.3);
      color: #22c55e;
      padding: 14px 18px;
      border-radius: 18px;
      font-size: 0.9rem;
      display: none;
      margin-bottom: 20px;
    }
    
    .success-message.show { display: block; }
  </style>
</head>
<body id="app-body">
  <header>
    <div class="container nav">
      <a href="index.html" class="brand">
        <div class="logo"></div>
        <div>🍰 Уникальные десерты</div>
      </a>
      <div class="nav-actions">
        <div id="themeSwitcher"></div>
        <a href="index.html" class="btn">🏠 Каталог</a>
      </div>
    </div>
  </header>

  <main class="container">
    <div class="auth-container">
      <div class="auth-panel">
        <h1 class="auth-title">📝 Регистрация</h1>
        <p class="auth-subtitle">Создайте аккаунт для заказов и отзывов</p>
        
        <div class="error-message" id="errorMessage"></div>
        <div class="success-message" id="successMessage"></div>
        
        <form class="auth-form" id="registerForm">
          <div class="form-group">
            <label>👤 Имя</label>
            <input type="text" id="name" placeholder="Анна" autocomplete="name">
          </div>
          
          <div class="form-group">
            <label>📧 Email *</label>
            <input type="email" id="email" placeholder="you@mail.ru" required autocomplete="email">
            <div class="email-hint">Разрешены только: @mail.ru и @yandex.ru</div>
          </div>
          
          <div class="form-group">
            <label>🔒 Пароль *</label>
            <input type="password" id="password" placeholder="••••••••" required autocomplete="new-password">
            <div class="password-hint">Минимум 6 символов</div>
          </div>
          
          <div class="form-group">
            <label>🔒 Подтверждение пароля *</label>
            <input type="password" id="confirmPassword" placeholder="••••••••" required autocomplete="new-password">
          </div>
          
          <button type="submit" class="btn-register">📝 Зарегистрироваться</button>
        </form>
        
        <div class="auth-footer">
          Уже есть аккаунт? <a href="login.html">Войти</a>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <div class="container footer-wrap">
      <div>
        <div class="footer-title">📞 Контакты</div>
        <div class="footer-sub">Свяжитесь с нами для заказа</div>
        <div class="contact-list" id="footerContacts"></div>
      </div>
      <div class="small">
        <div><b>🍪 Навигация:</b></div>
        <div><a href="index.html">Каталог</a> · <a href="cake.html?id=cake_1">Пример торта</a></div>
        <div style="margin-top: 16px;">© 2026 Уникальные десерты</div>
      </div>
    </div>
  </footer>

  <script src="js/theme.js"></script>
  <script src="js/api.js"></script>
  <script src="js/utils.js"></script>

  <script>
    (function(){
      "use strict";

      async function init() {
        SweetBakeTheme.createSwitcher('themeSwitcher');
        await loadContacts();
        
        const session = SweetBakeAPI.auth.getSession();
        if (session) {
          window.location.href = 'index.html';
          return;
        }
        
        document.getElementById('registerForm').addEventListener('submit', handleRegister);
      }

      async function loadContacts() {
        try {
          const contacts = await SweetBakeAPI.api.contacts.get();
          const container = document.getElementById('footerContacts');
          if (!container) return;
          
          container.innerHTML = '';
          (contacts.items || []).forEach(item => {
            const row = document.createElement('div');
            row.className = 'contact-row';
            row.innerHTML = `<span class="contact-label">${item.label}</span><span>${item.value}</span>`;
            container.appendChild(row);
          });
        } catch (e) { console.warn('Контакты не загружены'); }
      }

      // ===== ВАЛИДАЦИЯ РОССИЙСКОГО EMAIL =====
      function isValidRussianEmail(email) {
        const allowedDomains = ['@mail.ru', '@yandex.ru'];
        return allowedDomains.some(domain => email.toLowerCase().endsWith(domain));
      }

      // ===== БАЗОВАЯ ВАЛИДАЦИЯ EMAIL =====
      function isValidEmailFormat(email) {
        const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        return re.test(email);
      }

      // ===== ПОКАЗАТЬ ОШИБКУ =====
      function showError(message) {
        const errorEl = document.getElementById('errorMessage');
        errorEl.textContent = message;
        errorEl.classList.add('show');
      }

      async function handleRegister(e) {
        e.preventDefault();
        
        const name = document.getElementById('name').value.trim();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirmPassword').value;
        
        const errorEl = document.getElementById('errorMessage');
        const successEl = document.getElementById('successMessage');
        
        errorEl.classList.remove('show');
        successEl.classList.remove('show');
        
        // Валидация
        if (!email || !password || !confirmPassword) {
          showError('❌ Пожалуйста, заполните все обязательные поля');
          return;
        }
        
        if (!isValidEmailFormat(email)) {
          showError('❌ Пожалуйста, введите корректный email');
          return;
        }
        
        if (!isValidRussianEmail(email)) {
          showError('❌ Разрешены только email: @mail.ru или @yandex.ru');
          return;
        }
        
        if (password.length < 6) {
          showError('❌ Пароль должен содержать минимум 6 символов');
          return;
        }
        
        if (password !== confirmPassword) {
          showError('❌ Пароли не совпадают');
          return;
        }
        
        const submitBtn = e.target.querySelector('button[type="submit"]');
        const originalText = submitBtn.textContent;
        submitBtn.textContent = '⏳ Регистрируем...';
        submitBtn.disabled = true;
        
        try {
          const userData = {
            name: name || email.split('@')[0],
            email: email,
            password: password
          };
          
          const result = await SweetBakeAPI.auth.register(userData);
          
          successEl.textContent = '✅ Регистрация успешна! Перенаправляем...';
          successEl.classList.add('show');
          
          SweetBakeUtils.showToast(`🎉 Добро пожаловать, ${result.user.name || result.user.email}!`);
          
          setTimeout(() => {
            window.location.href = 'index.html';
          }, 1000);
          
        } catch (error) {
          showError(error.message || '❌ Ошибка при регистрации. Попробуйте другой email.');
          submitBtn.textContent = originalText;
          submitBtn.disabled = false;
        }
      }

      init();
    })();
  </script>
</body>
</html>
